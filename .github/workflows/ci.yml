# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # CI uses the stock Mosquitto image (anonymous broker default). Local `make docker-up`
    # mounts mosquitto/config — behavior is equivalent for tests (anonymous MQTT on :1883).
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_rr -t healthcheck -e healthcheck -m probe -W 3 --quiet --host localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    env:
      MQTT_HOST: localhost
      MQTT_PORT: 1883
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            dashboard/deps
            dashboard/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('dashboard/mix.lock') }}

      - name: Install deps
        run: |
          cd dashboard
          mix deps.get

      - name: Check formatting
        run: cd dashboard && mix format --check-formatted

      - name: Run tests
        run: cd dashboard && mix test

      - name: Credo (strict)
        run: cd dashboard && mix credo --strict

  esp32-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Physics + protocol tests (no ESP-IDF)
        run: make -C esp32/plant_monitor/host test
      - name: Build host C firmware
        run: make -C esp32/plant_monitor/host

  nerves-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            nerves/plant_monitor/deps
            nerves/plant_monitor/_build
          key: ${{ runner.os }}-nerves-mix-${{ hashFiles('nerves/plant_monitor/mix.lock') }}
      - name: Install deps
        run: cd nerves/plant_monitor && mix deps.get
      - name: Format
        run: cd nerves/plant_monitor && mix format --check-formatted
      - name: Test host firmware
        run: cd nerves/plant_monitor && mix test
